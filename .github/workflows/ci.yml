name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  game-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: game_engine/package-lock.json
      - run: npm ci
      - run: npm run build
